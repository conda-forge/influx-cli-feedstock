schema_version: 1

context:
  version: "2.8.0"

package:
  name: influx-cli
  version: ${{ version }}

source:
  url: https://github.com/influxdata/influx-cli/archive/v${{ version }}.tar.gz
  sha256: a507a4d0a0f4858d575f5a5c343c0f80e00151715c381d8be402c8bb6c9b8769

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - influx-cli --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: CLI for managing resources in InfluxDB v2
  homepage: https://github.com/influxdata/influx-cli
  repository: https://github.com/influxdata/influx-cli

extra:
  recipe-maintainers:
    - danielnachun
