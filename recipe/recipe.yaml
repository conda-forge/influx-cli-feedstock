schema_version: 1

context:
  version: "2.9.1"

package:
  name: influx-cli
  version: ${{ version }}

source:
  url: https://github.com/influxdata/influx-cli/archive/v${{ version }}.tar.gz
  sha256: 5a16c3866640518339a31fe03a25c341f6f9ae5c2fbd149c5bc47e95e6e9e8b9

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - influx-cli --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: CLI for managing resources in InfluxDB v2
  homepage: https://github.com/influxdata/influx-cli
  repository: https://github.com/influxdata/influx-cli

extra:
  recipe-maintainers:
    - danielnachun
